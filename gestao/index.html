<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel da Clínica (demo)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/style.css">
<style>
  .app { display: grid; grid-template-columns: 220px 1fr; min-height: calc(100vh - 31px); }
  aside { background: #13201f; color: #c9d8d6; padding: 20px 12px; }
  aside .logo { font: 600 20px var(--font-display); color: #fff; padding: 0 10px 18px; }
  aside nav button { display: flex; width: 100%; gap: 10px; align-items: center; background: none; border: 0; color: inherit; font: 500 15px var(--font); padding: 10px 12px; border-radius: 10px; cursor: pointer; text-align: left; }
  aside nav button[aria-current="true"] { background: #23403c; color: #fff; }
  aside .foot { margin-top: 24px; padding: 0 10px; font-size: 12px; display: grid; gap: 8px; }
  aside .foot a, aside .foot button { color: #9fe3da; background: none; border: 0; padding: 0; font: inherit; cursor: pointer; text-align: left; }
  main { padding: 24px; min-width: 0; }
  main h1 { font: 600 26px var(--font-display); margin: 0; }
  .head { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }
  @media (max-width: 820px) {
    .app { grid-template-columns: minmax(0, 1fr); }
    aside { min-width: 0; }
    aside { padding: 10px; }
    aside .logo, aside .foot { display: none; }
    aside nav { display: flex; overflow-x: auto; gap: 4px; }
    aside nav button { width: auto; white-space: nowrap; }
    main { padding: 16px; }
  }

  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin-bottom: 20px; }
  .kpi { padding: 16px; }
  .kpi .v { font: 600 28px var(--font-display); }
  .kpi .l { color: var(--muted); font-size: 13px; }
  .kpi.alerta .v { color: var(--warn); }

  .cols { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 16px; }
  .cols.auto { grid-template-columns: repeat(auto-fit, minmax(min(300px, 100%), 1fr)); }
  @media (max-width: 1080px) { .cols { grid-template-columns: minmax(0, 1fr); } }
  .ag > div { min-width: 0; }
  .kpis { grid-template-columns: repeat(auto-fit, minmax(min(150px, 100%), 1fr)); }
  .bar { grid-template-columns: minmax(90px, 140px) minmax(0, 1fr) 32px; }
  .box { padding: 18px; }
  .box h2 { font-size: 17px; margin-bottom: 12px; }

  .ag { display: grid; grid-template-columns: 56px 1fr auto; gap: 12px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--border); }
  .ag:last-child { border: 0; }
  .ag .h { font-weight: 600; font-variant-numeric: tabular-nums; }
  .ag .acts { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
  .ag small { color: var(--muted); }
  @media (max-width: 560px) { .ag { grid-template-columns: 48px 1fr; } .ag .acts { grid-column: 1 / -1; justify-content: flex-start; } }

  .feed { list-style: none; padding: 0; margin: 0; font-size: 14px; max-height: 460px; overflow-y: auto; }
  .feed li { padding: 8px 0; border-bottom: 1px dashed var(--border); }
  .feed .o { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; color: var(--primary); }

  .daynav { display: flex; gap: 8px; align-items: center; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; }
  .table-wrap { overflow-x: auto; }

  .kanban { display: grid; grid-template-columns: repeat(4, minmax(220px, 1fr)); gap: 12px; overflow-x: auto; }
  .col { background: var(--surface-2); border-radius: var(--radius); padding: 12px; min-height: 200px; }
  .col h3 { font-size: 14px; display: flex; justify-content: space-between; }
  .oc { padding: 12px; margin-top: 10px; font-size: 14px; }
  .oc .val { font-weight: 600; }
  .oc .parado { color: var(--warn); font-size: 12px; font-weight: 600; }
  .oc .acts { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }

  .bars { display: grid; gap: 10px; }
  .bar { display: grid; grid-template-columns: 140px 1fr 40px; gap: 10px; align-items: center; font-size: 14px; }
  .bar .t { height: 12px; border-radius: 6px; background: var(--surface-2); overflow: hidden; }
  .bar .t i { display: block; height: 100%; background: var(--primary); border-radius: 6px; }

  dialog { border: 0; border-radius: 18px; padding: 24px; width: min(520px, 100% - 32px); box-shadow: 0 20px 60px rgba(0,0,0,.25); }
  dialog::backdrop { background: rgba(10, 25, 25, .45); }
  .form-grid { display: grid; gap: 12px; }
</style>
</head>
<body>
<div class="demo-banner">Demonstração de portfólio: painel de uma clínica fictícia, com dados de exemplo. · <a href="../index.html">Ver todas as demos</a></div>

<div class="app">
  <aside>
    <div class="logo">Aurora · Painel</div>
    <nav id="nav">
      <button data-tab="hoje" aria-current="true">🏠 Hoje</button>
      <button data-tab="agenda">📅 Agenda</button>
      <button data-tab="orcamentos">💬 Orçamentos</button>
      <button data-tab="pacientes">👥 Pacientes</button>
      <button data-tab="indicadores">📊 Indicadores</button>
    </nav>
    <div class="foot">
      <a href="../site/index.html">Abrir site da clínica ↗</a>
      <a href="../chatbot/index.html">Abrir WhatsApp (demo) ↗</a>
      <button id="reset">Restaurar dados de exemplo</button>
    </div>
  </aside>
  <main id="main"></main>
</div>

<dialog id="dlg"></dialog>

<script src="../assets/store.js"></script>
<script>
  const S = DemoStore, U = S.util;
  const $ = (s) => document.querySelector(s);
  const esc = (t) => String(t).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  let aba = 'hoje';
  let diaAgenda = U.hoje();
  let busca = '';

  const saudacao = () => { const h = new Date().getHours(); return h < 12 ? 'Bom dia! ☀️' : h < 18 ? 'Boa tarde! 🌤️' : 'Boa noite! 🌙'; };
  const badge = (st) => `<span class="badge ${st}">${S.STATUS[st]}</span>`;
  const valorAg = (a) => S.servico(a.servicoId).preco || 0;

  function acoesAg(a) {
    const b = (st, txt, cls = 'btn-ghost') => `<button class="btn ${cls} btn-sm" data-ag="${a.id}" data-st="${st}">${txt}</button>`;
    if (a.status === 'pendente') return b('confirmado', 'Confirmar', 'btn-primary') + b('cancelado', 'Cancelar');
    if (a.status === 'confirmado') return b('concluido', 'Atendido', 'btn-primary') + b('faltou', 'Faltou');
    return '';
  }

  function linhaAg(a) {
    const p = S.paciente(a.pacienteId), s = S.servico(a.servicoId);
    return `<div class="ag">
      <span class="h">${a.hora}</span>
      <div><b>${esc(p.nome)}</b> ${badge(a.status)}<br><small>${s.nome} · ${S.profissional(a.proId).nome} · via ${S.ORIGENS[a.origem]}</small></div>
      <div class="acts">${acoesAg(a)}</div>
    </div>`;
  }

  const doDia = (d) => S.load().agendamentos.filter((a) => a.data === d && a.status !== 'cancelado').sort((a, b) => a.hora.localeCompare(b.hora));

  function viewHoje() {
    const d = S.load(), hj = U.hoje();
    const lista = doDia(hj);
    const pend = d.agendamentos.filter((a) => a.status === 'pendente' && a.data >= hj).length;
    const parados = d.orcamentos.filter((o) => ['enviado', 'negociacao'].includes(o.etapa) && U.diasEntre(o.ultimoContato, hj) >= 5);
    const previsto = lista.reduce((t, a) => t + valorAg(a), 0);
    return `
      <div class="head"><div><h1>${saudacao()}</h1><span class="muted">${U.fmtData(hj)}</span></div>
        <button class="btn btn-primary" id="novo">+ Novo agendamento</button></div>
      <div class="kpis">
        <div class="card kpi"><div class="v">${lista.length}</div><div class="l">atendimentos hoje</div></div>
        <div class="card kpi ${pend ? 'alerta' : ''}"><div class="v">${pend}</div><div class="l">aguardando confirmação</div></div>
        <div class="card kpi ${parados.length ? 'alerta' : ''}"><div class="v">${parados.length}</div><div class="l">orçamentos parados há 5+ dias</div></div>
        <div class="card kpi"><div class="v">${U.brl(previsto)}</div><div class="l">previsto para hoje</div></div>
      </div>
      <div class="cols">
        <div class="card box"><h2>Agenda de hoje</h2>${lista.map(linhaAg).join('') || '<p class="muted">Nenhum atendimento hoje.</p>'}</div>
        <div class="card box"><h2>Atividade recente</h2><ul class="feed">${d.atividade.slice(0, 15).map((x) =>
          `<li><span class="o">${esc(S.ORIGENS[x.origem] || x.origem)}</span> · <span class="muted">${new Date(x.quando).toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' })}</span><br>${esc(x.texto)}</li>`).join('')}</ul>
          <p class="muted" style="font-size:12px">Agende pelo <a href="../site/index.html">site</a> ou pelo <a href="../chatbot/index.html">WhatsApp</a> e veja aparecer aqui.</p></div>
      </div>`;
  }

  function viewAgenda() {
    const lista = doDia(diaAgenda);
    const porPro = S.PROFISSIONAIS.map((p) => ({ p, itens: lista.filter((a) => a.proId === p.id) }));
    return `
      <div class="head"><h1>Agenda</h1>
        <div class="daynav">
          <button class="btn btn-ghost btn-sm" data-dia="-1">←</button>
          <b>${U.fmtData(diaAgenda)}</b>
          <button class="btn btn-ghost btn-sm" data-dia="1">→</button>
          <button class="btn btn-ghost btn-sm" data-dia="0">Hoje</button>
          <button class="btn btn-primary btn-sm" id="novo">+ Novo</button>
        </div></div>
      <div class="cols auto">
        ${porPro.map(({ p, itens }) => `<div class="card box"><h2>${p.nome}<br><small class="muted" style="font-weight:400">${p.esp}</small></h2>
          ${itens.map(linhaAg).join('') || '<p class="muted">Sem atendimentos.</p>'}</div>`).join('')}
      </div>`;
  }

  function viewOrcamentos() {
    const d = S.load(), hj = U.hoje();
    const etapas = Object.keys(S.ETAPAS_ORCAMENTO);
    return `
      <div class="head"><h1>Orçamentos</h1><span class="muted">Orçamento parado há 5 dias ou mais recebe alerta e mensagem de follow-up pronta.</span></div>
      <div class="kanban">${etapas.map((et) => {
        const itens = d.orcamentos.filter((o) => o.etapa === et);
        const total = itens.reduce((t, o) => t + o.valor, 0);
        return `<div class="col"><h3><span>${S.ETAPAS_ORCAMENTO[et]} (${itens.length})</span><span class="muted">${U.brl(total)}</span></h3>
          ${itens.map((o) => {
            const dias = U.diasEntre(o.ultimoContato, hj);
            const aberto = et === 'enviado' || et === 'negociacao';
            return `<div class="card oc">
              <b>${esc(S.paciente(o.pacienteId).nome)}</b><br>${esc(o.descricao)}<br><span class="val">${U.brl(o.valor)}</span>
              ${aberto && dias >= 5 ? `<div class="parado">⚠ sem contato há ${dias} dias</div>` : `<div class="muted" style="font-size:12px">último contato: ${U.fmtCurta(o.ultimoContato)}</div>`}
              ${aberto ? `<div class="acts">
                <button class="btn btn-primary btn-sm" data-follow="${o.id}">Follow-up</button>
                ${et === 'enviado' ? `<button class="btn btn-ghost btn-sm" data-orc="${o.id}" data-et="negociacao">Negociando</button>` : ''}
                <button class="btn btn-ghost btn-sm" data-orc="${o.id}" data-et="aprovado">Aprovado</button>
                <button class="btn btn-ghost btn-sm" data-orc="${o.id}" data-et="perdido">Perdido</button></div>` : ''}
            </div>`;
          }).join('')}</div>`;
      }).join('')}</div>`;
  }

  function viewPacientes() {
    const d = S.load(), hj = U.hoje();
    const linhas = d.pacientes.map((p) => {
      const ags = d.agendamentos.filter((a) => a.pacienteId === p.id);
      const passadas = ags.filter((a) => a.status === 'concluido').sort((a, b) => b.data.localeCompare(a.data));
      const prox = ags.filter((a) => a.data >= hj && ['pendente', 'confirmado'].includes(a.status)).sort((a, b) => a.data.localeCompare(b.data))[0];
      const gasto = passadas.reduce((t, a) => t + valorAg(a), 0);
      return { p, ultima: passadas[0], prox, gasto, faltas: ags.filter((a) => a.status === 'faltou').length };
    }).filter((x) => !busca || x.p.nome.toLowerCase().includes(busca.toLowerCase()))
      .sort((a, b) => a.p.nome.localeCompare(b.p.nome));
    return `
      <div class="head"><h1>Pacientes</h1><input id="busca" placeholder="Buscar por nome" value="${esc(busca)}" style="max-width:260px"></div>
      <div class="card box table-wrap"><table>
        <thead><tr><th>Nome</th><th>WhatsApp</th><th>Última visita</th><th>Próximo horário</th><th>Faltas</th><th>Total</th></tr></thead>
        <tbody>${linhas.map((x) => `<tr>
          <td><b>${esc(x.p.nome)}</b></td><td>${esc(x.p.tel)}</td>
          <td>${x.ultima ? U.fmtCurta(x.ultima.data) : '—'}</td>
          <td>${x.prox ? U.fmtCurta(x.prox.data) + ' ' + x.prox.hora : '<span class="muted">sem horário</span>'}</td>
          <td>${x.faltas || '—'}</td><td>${U.brl(x.gasto)}</td></tr>`).join('')}</tbody>
      </table></div>`;
  }

  function viewIndicadores() {
    const d = S.load(), hj = U.hoje(), ini = U.iso(U.addDays(new Date(), -14));
    const per = d.agendamentos.filter((a) => a.data >= ini && a.data < hj);
    const feitos = per.filter((a) => a.status === 'concluido'), faltas = per.filter((a) => a.status === 'faltou');
    const taxaFalta = per.length ? Math.round(faltas.length / (feitos.length + faltas.length) * 100) : 0;
    const receita = feitos.reduce((t, a) => t + valorAg(a), 0);
    const abertos = d.orcamentos.filter((o) => ['enviado', 'negociacao'].includes(o.etapa));
    const fechados = d.orcamentos.filter((o) => o.etapa === 'aprovado').length, perdidos = d.orcamentos.filter((o) => o.etapa === 'perdido').length;
    const conv = fechados + perdidos ? Math.round(fechados / (fechados + perdidos) * 100) : 0;
    const contar = (lista, chave) => lista.reduce((m, a) => (m[chave(a)] = (m[chave(a)] || 0) + 1, m), {});
    const barras = (obj, nome) => { const max = Math.max(1, ...Object.values(obj)); return Object.entries(obj).sort((a, b) => b[1] - a[1]).map(([k, v]) =>
      `<div class="bar"><span>${esc(nome(k))}</span><span class="t"><i style="width:${v / max * 100}%"></i></span><b>${v}</b></div>`).join(''); };
    const todos = d.agendamentos.filter((a) => a.status !== 'cancelado');
    return `
      <div class="head"><h1>Indicadores</h1><span class="muted">Últimos 14 dias</span></div>
      <div class="kpis">
        <div class="card kpi"><div class="v">${feitos.length}</div><div class="l">atendimentos realizados</div></div>
        <div class="card kpi"><div class="v">${U.brl(receita)}</div><div class="l">faturamento estimado</div></div>
        <div class="card kpi ${taxaFalta > 10 ? 'alerta' : ''}"><div class="v">${taxaFalta}%</div><div class="l">taxa de faltas</div></div>
        <div class="card kpi"><div class="v">${U.brl(abertos.reduce((t, o) => t + o.valor, 0))}</div><div class="l">em orçamentos abertos</div></div>
        <div class="card kpi"><div class="v">${conv}%</div><div class="l">orçamentos aprovados</div></div>
      </div>
      <div class="cols auto">
        <div class="card box"><h2>Agendamentos por origem</h2><div class="bars">${barras(contar(todos, (a) => a.origem), (k) => S.ORIGENS[k])}</div></div>
        <div class="card box"><h2>Agendamentos por serviço</h2><div class="bars">${barras(contar(todos, (a) => a.servicoId), (k) => S.servico(k).nome)}</div></div>
      </div>`;
  }

  const VIEWS = { hoje: viewHoje, agenda: viewAgenda, orcamentos: viewOrcamentos, pacientes: viewPacientes, indicadores: viewIndicadores };

  function render() {
    $('#main').innerHTML = VIEWS[aba]();
    document.querySelectorAll('#nav button').forEach((b) => b.setAttribute('aria-current', String(b.dataset.tab === aba)));
    const bi = $('#busca');
    if (bi) { bi.oninput = (e) => { busca = e.target.value; render(); const n = $('#busca'); n.focus(); n.setSelectionRange(busca.length, busca.length); }; }
  }

  function dialogNovo() {
    const dlg = $('#dlg');
    const dias = S.proximosDiasAbertos(10);
    dlg.innerHTML = `<h2 style="margin-top:0">Novo agendamento</h2>
      <form class="form-grid" id="fn">
        <div><label>Paciente</label><input id="n-nome" placeholder="Nome" required></div>
        <div><label>WhatsApp</label><input id="n-tel" placeholder="(11) 90000-0000" required></div>
        <div><label>Serviço</label><select id="n-sv">${S.SERVICOS.map((s) => `<option value="${s.id}">${s.nome}</option>`).join('')}</select></div>
        <div><label>Dia</label><select id="n-dia">${dias.map((d) => `<option value="${d}" ${d === diaAgenda ? 'selected' : ''}>${U.fmtData(d)}</option>`).join('')}</select></div>
        <div><label>Horário</label><select id="n-hora"></select></div>
        <div><label>Origem</label><select id="n-or"><option value="telefone">Telefone</option><option value="recepcao">Recepção</option></select></div>
        <p class="erro" id="n-erro" style="color:var(--danger);margin:0"></p>
        <div style="display:flex;gap:8px;justify-content:flex-end"><button type="button" class="btn btn-ghost" onclick="dlg.close()">Cancelar</button><button class="btn btn-primary">Agendar</button></div>
      </form>`;
    const horas = () => { const sl = S.slots($('#n-dia').value, $('#n-sv').value); $('#n-hora').innerHTML = sl.map((x) => `<option>${x.hora}</option>`).join('') || '<option value="">Sem horários</option>'; };
    $('#n-dia').onchange = horas; $('#n-sv').onchange = horas; horas();
    $('#fn').onsubmit = (e) => {
      e.preventDefault();
      try {
        if (!$('#n-hora').value || $('#n-nome').value.trim().length < 3) throw new Error('Preencha nome e horário.');
        S.agendar({ nome: $('#n-nome').value.trim(), tel: $('#n-tel').value.trim(), servicoId: $('#n-sv').value, data: $('#n-dia').value, hora: $('#n-hora').value, origem: $('#n-or').value, status: 'confirmado' });
        dlg.close(); render();
      } catch (err) { $('#n-erro').textContent = err.message; }
    };
    dlg.showModal();
  }

  function dialogFollow(id) {
    const o = S.load().orcamentos.find((x) => x.id === id);
    const p = S.paciente(o.pacienteId);
    const dias = U.diasEntre(o.ultimoContato, U.hoje());
    const txt = `Oi, ${p.nome.split(' ')[0]}! Tudo bem? Aqui é da ${S.CLINICA.nome}. 😊\n\nPassando para saber se ficou alguma dúvida sobre o seu plano de ${o.descricao.toLowerCase()} (${U.brl(o.valor)}). Conseguimos parcelar em até 10x e, se quiser, a doutora pode te explicar cada etapa por aqui mesmo.\n\nPosso reservar um horário para você começar?`;
    const dlg = $('#dlg');
    dlg.innerHTML = `<h2 style="margin-top:0">Follow-up de orçamento</h2>
      <p class="muted" style="margin-top:-6px">${esc(p.nome)} · ${dias} dias sem contato</p>
      <textarea id="ftxt" rows="9">${esc(txt)}</textarea>
      <p class="muted" style="font-size:13px">Na versão real, a IA (Claude) escreve a mensagem a partir do histórico do paciente, e ela pode sair sozinha pelo WhatsApp.</p>
      <div style="display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap">
        <button class="btn btn-ghost" onclick="dlg.close()">Fechar</button>
        <button class="btn btn-ghost" id="fcopy">Copiar</button>
        <button class="btn btn-primary" id="fok">Marcar como enviado</button></div>`;
    $('#fcopy').onclick = () => { navigator.clipboard?.writeText($('#ftxt').value); $('#fcopy').textContent = 'Copiado ✓'; };
    $('#fok').onclick = () => { S.atualizarOrcamento(id, { ultimoContato: U.hoje() }); S.registrar('recepcao', `Follow-up enviado para ${p.nome}`); S.save(); dlg.close(); render(); };
    dlg.showModal();
  }

  const dlg = $('#dlg');
  document.addEventListener('click', (e) => {
    const t = e.target.closest('button');
    if (!t) return;
    if (t.dataset.tab) { aba = t.dataset.tab; render(); }
    else if (t.dataset.ag) { S.atualizarAgendamento(Number(t.dataset.ag), { status: t.dataset.st }); render(); }
    else if (t.dataset.dia != null) { diaAgenda = t.dataset.dia === '0' ? U.hoje() : U.iso(U.addDays(U.parseISO(diaAgenda), Number(t.dataset.dia))); render(); }
    else if (t.dataset.orc) { S.atualizarOrcamento(Number(t.dataset.orc), { etapa: t.dataset.et, ultimoContato: U.hoje() }); render(); }
    else if (t.dataset.follow) dialogFollow(Number(t.dataset.follow));
    else if (t.id === 'novo') dialogNovo();
    else if (t.id === 'reset') { if (confirm('Restaurar os dados de exemplo? Os agendamentos feitos na demo serão apagados.')) { S.reset(); render(); } }
  });

  document.addEventListener('demo:changed', render);
  render();
</script>
